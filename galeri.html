    <!--
      Cara mengisi galeri ini:
      1. Upload file fotomu ke folder yang sama dengan galeri.html (misalnya di dalam folder "galeri/").
      2. Ganti src="" tiap <img> di bawah dengan nama file fotomu, misalnya src="galeri/foto-1.jpg".
      3. Ganti teks data-caption dan alt dengan judul singkat foto tersebut.
      4. Hapus <figure> yang tidak dipakai kalau fotomu kurang dari 15.
      5. Kalau mau, perbarui juga angka "Karya di Galeri" di tentang.html secara manual.
      Maksimal 15 foto.
    -->
    <div class="gallery-grid" id="galleryGrid">
      <figure class="gallery-item"><img src="" alt="Foto karya 1" data-caption="Foto karya 1" loading="lazy"></figure>
      <figure class="gallery-item"><img src="" alt="Foto karya 2" data-caption="Foto karya 2" loading="lazy"></figure>
